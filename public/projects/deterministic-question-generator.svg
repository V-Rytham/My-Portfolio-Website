<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1127 909" width="1127" height="909"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef0ff"/><stop offset="1" stop-color="#e9fbff"/></linearGradient></defs><rect width="1127" height="909" fill="#f4f7fb"/><rect x="49" y="14" width="1028" height="216" rx="18" fill="url(#bg)"/><text x="73" y="52" fill="#667085" font-family="Arial" font-size="14" letter-spacing="1">DETERMINISTIC QUESTION ENGINE</text><text x="72" y="98" fill="#171b2a" font-family="Arial" font-size="38" font-weight="700">Turn any Gutenberg book into reliable MCQs in one click.</text><text x="73" y="131" fill="#2764ff" font-family="Arial" font-size="16">Reproducible questions out.</text><rect x="72" y="171" width="141" height="35" rx="9" fill="#0ea5d9"/><text x="88" y="194" fill="white" font-family="Arial" font-size="14" font-weight="700">Try it with a book</text><text x="225" y="194" fill="#303852" font-family="Arial" font-size="15">Book → Processing → Questions</text><rect x="49" y="246" width="1028" height="252" rx="18" fill="#fff"/><text x="66" y="281" fill="#171b2a" font-size="16" font-family="Arial" font-weight="700">How it works</text><text x="897" y="281" fill="#536078" font-size="13" font-family="Arial">Tap a stage to reveal details</text><g font-family="Arial" font-size="14" fill="#303852"><rect x="66" y="314" width="193" height="77" rx="10" fill="#fff" stroke="#b5c7ff"/><text x="128" y="370">📚 Fetch Book</text><rect x="267" y="314" width="193" height="77" rx="10" fill="#fff" stroke="#d5dce8"/><text x="324" y="370">✂️ Split &amp; Clean</text><rect x="467" y="314" width="193" height="77" rx="10" fill="#fff" stroke="#d5dce8"/><text x="540" y="370">🧠 NLP Processing</text><rect x="667" y="314" width="193" height="77" rx="10" fill="#fff" stroke="#d5dce8"/><text x="754" y="370">🔍 Fact Extraction</text><rect x="868" y="314" width="193" height="77" rx="10" fill="#fff" stroke="#d5dce8"/><text x="950" y="370">❓ MCQ Generation</text></g><rect x="66" y="406" width="995" height="75" rx="12" fill="#f7faff" stroke="#c9d6ff"/><text x="118" y="437" fill="#171b2a" font-family="Arial" font-weight="700">Fetch Book</text><text x="118" y="462" fill="#536078" font-family="Arial" font-size="14">Pulls Gutenberg content by ID and validates source metadata.</text><g font-family="Arial"><rect x="49" y="515" width="247" height="131" rx="12" fill="#fff"/><rect x="309" y="515" width="248" height="131" rx="12" fill="#fff"/><rect x="569" y="515" width="248" height="131" rx="12" fill="#fff"/><rect x="830" y="515" width="247" height="131" rx="12" fill="#fff"/><text x="66" y="580" font-size="16" font-weight="700">Deterministic Output</text><text x="325" y="580" font-size="16" font-weight="700">Reproducible Pipeline</text><text x="585" y="580" font-size="16" font-weight="700">Structured NLP Extraction</text><text x="846" y="580" font-size="16" font-weight="700">API-Ready Backend</text></g><rect x="49" y="671" width="1028" height="215" rx="12" fill="#fff" stroke="#d7dde8"/><text x="67" y="706" fill="#111827" font-family="Arial" font-size="18" font-weight="700">Generate MCQs</text><rect x="67" y="779" width="835" height="38" rx="7" fill="#fff" stroke="#c8d0dc"/><text x="80" y="803" fill="#6b7280" font-family="Arial" font-size="16">e.g., 1342 for Pride and Prejudice</text><rect x="911" y="792" width="148" height="35" rx="7" fill="#2563eb"/><text x="928" y="816" fill="white" font-size="16" font-family="Arial">Generate MCQs</text></svg>
